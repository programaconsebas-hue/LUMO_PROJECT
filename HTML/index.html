<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquetación Web </title>
    <link rel="stylesheet" href="estilos.css?v=3">
</head>
<body>

    <div class="layout-contenedor">

        <!-- 1. HEADER -->
        <header class="caja-maqueta">
            <span class="etiqueta">Lumo</span>
        </header>

        <!-- 2. CUERPO PRINCIPAL (Nav izquierda + Secciones derecha) -->
        <div class="layout-cuerpo">
            
            <!-- COLUMNA IZQUIERDA: NAV -->
            <aside class="columna-nav">
                <nav class="caja-maqueta">
                    <span class="etiqueta">NAV (Menú lateral)</span>
                </nav>
            </aside>

            <!-- COLUMNA DERECHA: MAIN CON SECCIONES -->
            <main class="columna-contenido">
                
                <!-- SECCIÓN 1 -->
                <section class="caja-maqueta seccion">
                    <span class="etiqueta">SECTION 1 (Bloque principal)</span>
                    
                    <div class="grid-sec1">
                        <article class="caja-maqueta">
                            <span class="etiqueta">ARTICLE (Contenido principal)</span>
                        </article>

                        <div class="stack-asides">
                            <aside class="caja-maqueta">
                                <span class="etiqueta">ASIDE 1</span>
                            </aside>
                            <aside class="caja-maqueta">
                                <span class="etiqueta">ASIDE 2</span>
                            </aside>
                        </div>
                    </div>
                </section>

                <!-- SECCIÓN 2 -->
                <section class="caja-maqueta seccion">
                    <span class="etiqueta">SECTION 2 (Bloque secundario)</span>
                    
                    <div class="grid-sec2">
                        <div class="espacio-libre">
                            <!-- Espacio reservado a la izquierda -->
                        </div>

                        <aside class="caja-maqueta">
                            <span class="etiqueta">ASIDE 3</span>
                        </aside>
                    </div>
                </section>

            </main>

        </div>

        <!-- 3. FOOTER -->
        <footer class="caja-maqueta">
            <span class="etiqueta">FOOTER (Pie de página)</span>
        </footer>

    </div>

</body>
</html>
